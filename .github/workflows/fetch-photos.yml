# --- Temporaire : récupère les photos de chantier publiées sur Obat --- \\
name: Récupérer les photos (temporaire)

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/fetch-photos.yml"]

permissions:
  contents: write # pour commiter les photos dans le dépôt

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les photos
        run: |
          mkdir -p images/source
          base=https://obat-directory-production.s3.amazonaws.com/obat-directory-production
          get() { curl -fsSL "$base/$1" -o "images/source/$2" || echo "échec : $1"; }
          get 648b905d-9c91-4367-9bed-7eb18c1f2ed5-min.jpg realisation-a.jpg
          get 4977d667-eafb-4713-b555-c34258ee4c4e-min.jpg realisation-b.jpg
          get eee5d0d5-1de9-4361-9171-40e4a7fc3a4e-min.jpg realisation-c.jpg
          get 9d165e3e-88bb-4019-8b0b-756ddb9d7d7f.jpg profil-a.jpg
          get 9d165e85-f019-4a5e-a9fd-dad57508337e.jpg profil-b.jpg
          get logo-union-chauffage.jpg logo.jpg
          ls -la images/source
      - name: Commiter les photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/source
          git commit -m "Photos de chantier récupérées depuis Obat" || echo "Rien à commiter"
          git push
